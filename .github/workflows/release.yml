name: Release

# Une version se publie en poussant un tag : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique et les tags : les notes de version partent du tag précédent

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Numéro de version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test tests/BarcodeBoard.Core.Tests -c Release

      - name: Exe autonome
        run: dotnet publish src/BarcodeBoard -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      # L'exe portable et l'installeur ne livrent que BarcodeBoard.exe : tout le reste doit être dedans.
      - name: Exe unique
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File -Recurse
          $files | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName }
          if ($files.Count -ne 1 -or $files[0].Name -ne 'BarcodeBoard.exe') {
            Write-Error "La publication doit produire le seul fichier BarcodeBoard.exe."
            exit 1
          }

      - name: Installeur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\BarcodeBoard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Version portable
        shell: pwsh
        run: Copy-Item publish\BarcodeBoard.exe "artifacts\BarcodeBoard-${{ steps.version.outputs.value }}-portable.exe"

      # Titres des commits (Conventional Commits) depuis la version précédente, classés par type.
      - name: Notes de version
        shell: bash
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          bash .github/scripts/release_notes.sh "$version" HEAD | tee release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fichiers produits
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BarcodeBoard-${{ steps.version.outputs.value }}
          path: artifacts/*

      - name: Publication GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          body_path: release-notes.md
