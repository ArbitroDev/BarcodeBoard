name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test tests/BarcodeBoard.Core.Tests -c Release
      - name: Compilation de l'application
        run: dotnet build src/BarcodeBoard -c Release
