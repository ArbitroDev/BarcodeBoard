name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test tests/BarcodeBoard.Core.Tests -c Release
      - name: Compilation de l'application
        run: dotnet build src/BarcodeBoard -c Release
      - name: Compilation de l'application WinUI
        run: dotnet build src/BarcodeBoard.WinUI -c Release
