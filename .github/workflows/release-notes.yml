name: Release notes

# Every pull request to main previews the notes of the next release, written
# from the commit titles (Conventional Commits) since the last version tag.
on:
  pull_request:
    branches: [main]

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preview the release notes
        run: bash .github/scripts/release_notes.sh "" HEAD | tee -a "$GITHUB_STEP_SUMMARY"
